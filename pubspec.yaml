name: molly_crossplatform
description: "Molly AI Agent - Ultra-Luxury iOS, macOS & Android Full Standalone Client & Local Database Engine"
publish_to: "none"
version: 2.7.2+29

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.3
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
